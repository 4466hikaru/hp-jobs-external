      x: x,
      y: y,
      hp: 1,
      r: SLIME_R,
      speed: spd,
      jiggle: Math.random() * TAU,
      scale: rand(0.88, 1.12)
    });
  }

  function burst(x, y) {
    var i, n = 11;
    for (i = 0; i < n; i++) {
      var gold = i < 4;
      var a = rand(0, TAU);
      var s = gold ? rand(40, 140) : rand(30, 110);
      particles.push({
        x: x + rand(-6, 6),
        y: y + rand(-8, 4),
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - rand(10, 40),
        life: rand(0.28, 0.55),
        max: 0.5,
        r: gold ? rand(1.4, 2.6) : rand(3.2, 6.5),
        gold: gold
      });
    }
  }

  function addSlash(x, y, ang) {
    slashes.push({ x: x, y: y, ang: ang, t: 0, dur: 0.16 });
  }

  function hurtPlayer() {
    if (player.iframes > 0) return;
    player.hp -= 1;
    player.iframes = IFRAMES;
    shakeT = 0.22;
    shakeAmp = 8;
    hitFlash = 1;
    if (player.hp <= 0) {
      player.hp = 0;
      finish(false);
    }
  }

  function finish(win) {
    if (state !== "play") return;
    var survived = win ? elapsed : Math.min(elapsed, MAX_TIME);
    if (!win && player.hp <= 0) survived = elapsed;
    var base = Math.floor(survived * 10);
    var bonus = win ? 500 : 0;
    result = {
      win: win,
      survived: survived,
      base: base,
      bonus: bonus,
      score: base + bonus
    };
    resultAge = 0;
    ignoreInput = win ? 0.28 : 0.12;
    state = "result";
  }

  function updateParticles(dt) {
    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 90 * dt;
      p.vx *= 0.92;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (i = slashes.length - 1; i >= 0; i--) {
      slashes[i].t += dt;
      if (slashes[i].t >= slashes[i].dur) slashes.splice(i, 1);
    }
  }

  function updateEnemies(dt) {
    var i, j, e, o, dx, dy, d, nx, ny, push;
    var late = clamp(elapsed / 50, 0, 1);

    var rate = lerp(1.2, 3.5, clamp(elapsed / 45, 0, 1));
    spawnAcc -= dt;
    while (spawnAcc <= 0) {
      spawnSlime();
      spawnAcc += 1 / rate;
    }

    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      dx = player.x - e.x;
      dy = player.y - e.y;
      d = len(dx, dy) || 1;
      e.x += (dx / d) * e.speed * dt;
      e.y += (dy / d) * e.speed * dt;
      e.jiggle += dt * (4 + late * 2);
    }

    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      for (j = i + 1; j < enemies.length; j++) {
        o = enemies[j];
        dx = o.x - e.x;
        dy = o.y - e.y;
        d = dx * dx + dy * dy;
        var minD = 22;
        if (d > 0.01 && d < minD * minD) {
          d = Math.sqrt(d);
          push = (minD - d) * 0.46;
          nx = dx / d;
          ny = dy / d;
          e.x -= nx * push;
          e.y -= ny * push;
          o.x += nx * push;
          o.y += ny * push;
        }
      }
    }

    if (player.iframes <= 0) {
      for (i = 0; i < enemies.length; i++) {
        e = enemies[i];
        if (dist(e.x, e.y, player.x, player.y) < PLAYER_R + e.r) {
          hurtPlayer();
          break;
        }
      }
    }
  }

  function nearestSlime(x, y, range) {
    var best = null;
    var bestD = range;
    var i, e, d;
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      d = dist(x, y, e.x, e.y);
      if (d < bestD) {
        bestD = d;
        best = e;
      }
    }
    return best;
  }

  function updatePrincess(dt) {
    var fx = player.facingX;
    var fy = player.facingY;
    var fl = len(fx, fy) || 1;
    fx /= fl;
    fy /= fl;

    var tx, ty;
    var threat = nearestSlime(player.x, player.y, 150);
    if (threat) {
      var sx = threat.x - player.x;
      var sy = threat.y - player.y;
      var sl = len(sx, sy) || 1;
      tx = threat.x - (sx / sl) * 20;
      ty = threat.y - (sy / sl) * 20;
    } else if (player.moving) {
      tx = player.x - fx * FOLLOW_DIST;
      ty = player.y - fy * FOLLOW_DIST;
    } else {
      tx = player.x - 42;
      ty = player.y + 38;
    }

    var dx = tx - princess.x;
    var dy = ty - princess.y;
    var d = len(dx, dy);
    princess.moving = d > 5;
    if (d > 3) {
      var step = Math.min(PRINCESS_SPEED * dt, d);
      princess.x += (dx / d) * step;
      princess.y += (dy / d) * step;
      if (d > 8) {
        princess.facingX = dx / d;
        princess.facingY = dy / d;
      }
    }

    princess.cd = Math.max(0, princess.cd - dt);
    princess.atkT = Math.max(0, princess.atkT - dt);
    princess.bob += dt * (princess.moving ? 11 : 4);

    var target = nearestSlime(princess.x, princess.y, ATK_RANGE);
    if (target && princess.cd <= 0) {
      var ax = target.x - princess.x;
      var ay = target.y - princess.y;
      var al = len(ax, ay) || 1;
      princess.facingX = ax / al;
      princess.facingY = ay / al;
      princess.atkAng = Math.atan2(ay, ax);
      princess.atkT = 0.16;
      princess.cd = ATK_CD;
      addSlash(princess.x + (ax / al) * 18, princess.y + (ay / al) * 10 - 18, princess.atkAng);
      target.hp -= 1;
      if (target.hp <= 0) {
        burst(target.x, target.y);
        var idx = enemies.indexOf(target);
        if (idx >= 0) enemies.splice(idx, 1);
        kills += 1;
      }
    }

    princess.x = clamp(princess.x, 8, WORLD_W - 8);
    princess.y = clamp(princess.y, 8, WORLD_H - 8);
  }

  function updatePlayer(dt) {
    var ix = 0, iy = 0;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iy -= 1;
    if (keys.KeyS || keys.ArrowDown) iy += 1;
    var l = len(ix, iy);
    if (l > 0) {
      ix /= l;
      iy /= l;
      player.facingX = ix;
      player.facingY = iy;
      player.moving = true;
    } else {
      player.moving = false;
    }
    player.x += ix * PLAYER_SPEED * dt;
    player.y += iy * PLAYER_SPEED * dt;
    player.x = clamp(player.x, 18, WORLD_W - 18);
    player.y = clamp(player.y, 18, WORLD_H - 18);
    player.iframes = Math.max(0, player.iframes - dt);
    player.bob += dt * (player.moving ? 10 : 3.5);

    if (dist(player.x, player.y, GATE_X, GATE_Y) < GATE_R) {
      finish(true);
    }
  }

  function updateCamera(dt) {
    var tx = player.x - VIEW_W * 0.5;
    var ty = player.y - VIEW_H * 0.45;
    camX = clamp(tx, 0, WORLD_W - VIEW_W);
    camY = clamp(ty, 0, WORLD_H - VIEW_H);
    if (shakeT > 0) {
      shakeT -= dt;
      camX += (Math.random() - 0.5) * 2 * shakeAmp;
      camY += (Math.random() - 0.5) * 2 * shakeAmp;
      shakeAmp *= Math.pow(0.04, dt);
      if (shakeT <= 0) shakeAmp = 0;
    }
    hitFlash = Math.max(0, hitFlash - dt * 3.2);
  }

  function updatePlay(dt) {
    elapsed += dt;
    remaining = MAX_TIME - elapsed;
    if (remaining <= 0) {
      remaining = 0;
      finish(false);
      return;
    }
    updatePlayer(dt);
    if (state !== "play") return;
    updatePrincess(dt);
    updateEnemies(dt);
    updateParticles(dt);
    updateCamera(dt);
  }

  function worldToScreen(x, y) {
    return { x: x - camX, y: y - camY };
  }

  function drawShadow(x, y, rx) {
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(x, y - 2, rx, rx * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSprite(img, x, y, drawH, flip, bob, alpha) {
    if (!img) return;
    var aspect = img.width / img.height;
    var dw = drawH * aspect;
    var dh = drawH;
    ctx.save();
    ctx.translate(x, y - bob);
    if (flip) ctx.scale(-1, 1);
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, -dw * 0.5, -dh, dw, dh);
    ctx.restore();
  }

  function drawTiles() {
    if (!tilePattern) return;
    ctx.save();
    var fx = Math.floor(camX);
    var fy = Math.floor(camY);
    ctx.translate(-fx, -fy);
    ctx.fillStyle = tilePattern;
    ctx.fillRect(fx, fy, VIEW_W + 1, VIEW_H + 1);
    ctx.restore();
  }

  function drawGate() {
    var s = worldToScreen(GATE_X, GATE_Y);
    var dNear = dist(player.x, player.y, GATE_X, GATE_Y);
    var glow = clamp(1 - dNear / 520, 0, 1);
    var pulse = 0.72 + Math.sin(clock * 3.2) * 0.18;
    var rad = 70 + glow * 140;
    var g = ctx.createRadialGradient(s.x, s.y - 10, 8, s.x, s.y - 10, rad);
    g.addColorStop(0, "rgba(255,210,90," + ((0.18 + glow * 0.5) * pulse).toFixed(3) + ")");
    g.addColorStop(0.45, "rgba(255,170,40," + ((0.08 + glow * 0.28) * pulse).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,140,20,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y - 8, rad, 0, TAU);
    ctx.fill();

    if (imgGate) {
      var gw = 168;
      var gh = gw * (imgGate.height / imgGate.width);
      ctx.drawImage(imgGate, s.x - gw * 0.5, s.y - gh * 0.78, gw, gh);
    }
  }

  function drawSlashes() {
    var i, sl, k, a;
    for (i = 0; i < slashes.length; i++) {
      sl = slashes[i];
      k = sl.t / sl.dur;
      a = 1 - k;
      var s = worldToScreen(sl.x, sl.y);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(sl.ang);
      ctx.globalAlpha = a;
      ctx.strokeStyle = "rgba(255,236,170,0.95)";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, 26 + k * 16, -0.95, 0.85);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 22 + k * 14, -0.8, 0.7);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,220,120," + (0.35 * a) + ")";
      ctx.beginPath();
      ctx.arc(18, 0, 7, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    var i, p, s, k;
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      k = clamp(p.life / 0.45, 0, 1);
      s = worldToScreen(p.x, p.y);
      ctx.globalAlpha = k;
      if (p.gold) {
        ctx.fillStyle = "#f4d56a";
        ctx.beginPath();
        ctx.arc(s.x, s.y, p.r * k, 0, TAU);
        ctx.fill();
      } else {
        ctx.fillStyle = "#1a1028";
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, p.r, p.r * 0.75, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#3a2458";
        ctx.beginPath();
        ctx.arc(s.x - 1, s.y - 1, p.r * 0.35, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawActors() {
    var list = [];
    var i, e, s, bob, flip, alpha;
    list.push({ kind: "gate", y: GATE_Y + 40 });
    list.push({ kind: "player", y: player.y });
    list.push({ kind: "princess", y: princess.y });
    for (i = 0; i < enemies.length; i++) {
      list.push({ kind: "slime", y: enemies[i].y, e: enemies[i] });
    }
    list.sort(function (a, b) { return a.y - b.y; });

    for (i = 0; i < list.length; i++) {
      var it = list[i];
      if (it.kind === "gate") {
        drawGate();
      } else if (it.kind === "player") {
        s = worldToScreen(player.x, player.y);
        bob = player.moving ? Math.sin(player.bob) * 2.4 : Math.sin(player.bob) * 0.6;
        flip = player.facingX > 0.12;
        alpha = 1;
        if (player.iframes > 0) alpha = (Math.sin(clock * 28) > 0) ? 0.28 : 1;
        drawShadow(s.x, s.y, 16);
        drawSprite(imgPlayer, s.x, s.y, 96, flip, bob, alpha);
      } else if (it.kind === "princess") {
        s = worldToScreen(princess.x, princess.y);
        bob = princess.moving ? Math.sin(princess.bob) * 2.2 : Math.sin(princess.bob) * 0.7;
        flip = princess.facingX < -0.08;
        var pop = princess.atkT > 0 ? 4 : 0;
        drawShadow(s.x, s.y, 22);
        drawSprite(imgPrincess, s.x, s.y, 114 + pop, flip, bob, 1);
      } else {
        e = it.e;
        s = worldToScreen(e.x, e.y);
        bob = Math.sin(e.jiggle) * 2.1;
        flip = (player.x < e.x);
        drawShadow(s.x, s.y, 14 * e.scale);
        drawSprite(imgSlime, s.x, s.y + 4, 44 * e.scale, flip, bob, 1);
      }
    }
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(VIEW_W * 0.5, VIEW_H * 0.48, 140, VIEW_W * 0.5, VIEW_H * 0.5, 560);
    g.addColorStop(0, "rgba(6,10,28,0.0)");
    g.addColorStop(0.45, "rgba(8,12,30,0.18)");
    g.addColorStop(0.78, "rgba(6,8,20,0.45)");
    g.addColorStop(1, "rgba(4,5,12,0.78)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = "rgba(20,28,70,0.10)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    if (hitFlash > 0) {
      var a = hitFlash * 0.55;
      var rg = ctx.createRadialGradient(VIEW_W * 0.5, VIEW_H * 0.5, 80, VIEW_W * 0.5, VIEW_H * 0.5, 520);
      rg.addColorStop(0, "rgba(180,20,30,0)");
      rg.addColorStop(0.55, "rgba(160,10,20," + (a * 0.25).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(120,0,10," + a.toFixed(3) + ")");
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  function drawHeart(x, y, s, on) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-9, -2, -8, -10, 0, -6);
    ctx.bezierCurveTo(8, -10, 9, -2, 0, 6);
    ctx.closePath();
    if (on) {
      ctx.fillStyle = "#e23b4a";
      ctx.fill();
      ctx.fillStyle = "rgba(255,210,210,0.55)";
      ctx.beginPath();
      ctx.ellipse(-2.2, -3.2, 2.1, 1.4, -0.5, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = "rgba(40,44,56,0.8)";
      ctx.fill();
      ctx.strokeStyle = "rgba(90,90,110,0.7)";
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHud() {
    var i;
    ctx.save();
    ctx.font = "14px 'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(18, 16, 168, 40);
    ctx.fillStyle = "rgba(220,210,190,0.7)";
    ctx.font = "11px 'Yu Gothic', 'Hiragino Sans', sans-serif";
    ctx.fillText("HP", 26, 20);
    for (i = 0; i < MAX_HP; i++) {
      drawHeart(46 + i * 34, 42, 1.15, i < player.hp);
    }

    var t = Math.max(0, remaining).toFixed(2);
    ctx.textAlign = "center";
    ctx.font = "22px 'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif";
    ctx.fillStyle = remaining < 10 ? "#f0c27a" : "#f3efe4";
    ctx.shadowColor = "rgba(0,0,0,0.7)";
    ctx.shadowBlur = 8;
    ctx.fillText(t, VIEW_W * 0.5, 18);
    ctx.shadowBlur = 0;
    ctx.font = "12px 'Yu Gothic', 'Hiragino Sans', sans-serif";
    ctx.fillStyle = "rgba(210,200,170,0.75)";
    ctx.fillText("北の門へ", VIEW_W * 0.5, 44);

    var meters = dist(player.x, player.y, GATE_X, GATE_Y) | 0;
    ctx.textAlign = "right";
    ctx.font = "16px 'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif";
    ctx.fillStyle = "#e8e0c8";
    ctx.fillText("門まで あと " + meters + "m", VIEW_W - 24, 22);
    ctx.restore();
  }

  function drawTitle() {
    ctx.fillStyle = "rgba(6,7,12,0.72)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    var vg = ctx.createRadialGradient(VIEW_W * 0.5, VIEW_H * 0.42, 40, VIEW_W * 0.5, VIEW_H * 0.42, 420);
    vg.addColorStop(0, "rgba(40,28,10,0.18)");
    vg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#f4ead0";
    ctx.font = "52px 'Yu Mincho', 'Hiragino Mincho ProN', 'YuMincho', serif";
    ctx.shadowColor = "rgba(0,0,0,0.85)";
    ctx.shadowBlur = 12;
    ctx.fillText("門まで帰るだけ", VIEW_W * 0.5, 250);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(212,175,80,0.75)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(VIEW_W * 0.5 - 210, 298);
    ctx.lineTo(VIEW_W * 0.5 + 210, 298);
    ctx.stroke();

    ctx.fillStyle = "#d8c899";
    ctx.font = "20px 'Yu Mincho', 'Hiragino Mincho ProN', serif";
    ctx.fillText("勝たなくていい。帰るだけで加点される。", VIEW_W * 0.5, 338);

    ctx.fillStyle = "rgba(200,196,186,0.88)";
    ctx.font = "15px 'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif";
    ctx.fillText("移動 WASD / 矢印　※攻撃はできない。姫が守る。", VIEW_W * 0.5, 390);

    var blink = 0.55 + Math.sin(titlePulse * 3.2) * 0.45;
    ctx.globalAlpha = blink;
    ctx.fillStyle = "#f0e6c4";
    ctx.font = "16px 'Yu Gothic', 'Hiragino Sans', sans-serif";
    ctx.fillText("クリック / キーで出発", VIEW_W * 0.5, 470);
    ctx.globalAlpha = 1;
  }

  function drawResult() {
    ctx.fillStyle = result.win ? "rgba(12,10,6,0.52)" : "rgba(8,8,12,0.55)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 10;

    if (result.win) {
      ctx.fillStyle = "#f3d98a";
      ctx.font = "40px 'Yu Mincho', 'Hiragino Mincho ProN', serif";
      ctx.fillText("帰還", VIEW_W * 0.5, 230);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#e8dfc4";
      ctx.font = "18px 'Yu Gothic', 'Hiragino Sans', sans-serif";
      ctx.fillText("門にたどり着いた。", VIEW_W * 0.5, 278);
      ctx.font = "16px 'Yu Gothic', 'Hiragino Sans', sans-serif";
      ctx.fillStyle = "#d8d0b8";
      ctx.fillText("生存 " + result.survived.toFixed(2) + " 秒  × 10  =  " + result.base, VIEW_W * 0.5, 330);
      ctx.fillStyle = "#f0d27a";
      ctx.fillText("帰還ボーナス  + " + result.bonus, VIEW_W * 0.5, 362);
      ctx.fillStyle = "#fff6d8";
      ctx.font = "28px 'Yu Gothic', 'Hiragino Sans', sans-serif";
      ctx.fillText("SCORE  " + result.score, VIEW_W * 0.5, 418);
    } else {
      ctx.fillStyle = "#c8c4d4";
      ctx.font = "32px 'Yu Mincho', 'Hiragino Mincho ProN', serif";
      ctx.fillText("門まで、まだ遠い。", VIEW_W * 0.5, 250);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#b8b4c0";
      ctx.font = "16px 'Yu Gothic', 'Hiragino Sans', sans-serif";
      ctx.fillText("生存 " + result.survived.toFixed(2) + " 秒", VIEW_W * 0.5, 312);
      ctx.fillText("SCORE  " + result.score, VIEW_W * 0.5, 348);
    }

    ctx.fillStyle = "rgba(230,220,190,0.8)";
    ctx.font = "14px 'Yu Gothic', 'Hiragino Sans', sans-serif";
    ctx.fillText("クリック / キーで再出発", VIEW_W * 0.5, 490);
  }

  function drawWorld() {
    ctx.imageSmoothingEnabled = false;
    drawTiles();
    drawActors();
    drawSlashes();
    drawParticles();
    drawVignette();
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#0b0c10";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    if (state === "title") {
      camX = clamp(1100 - VIEW_W * 0.5, 0, WORLD_W - VIEW_W);
      camY = clamp(3200 - VIEW_H * 0.45, 0, WORLD_H - VIEW_H);
      if (!player) {
        player = { x: 1100, y: 3200, facingX: 0, facingY: -1, moving: false, hp: MAX_HP, iframes: 0, bob: 0 };
        princess = { x: 1052, y: 3236, facingX: 0, facingY: -1, moving: false, cd: 0, bob: 0, atkT: 0, atkAng: 0 };
      }
      drawWorld();
      drawTitle();
    } else if (state === "play") {
      drawWorld();
      drawHud();
    } else {
      drawWorld();
      drawHud();
      drawResult();
    }
  }

  function onAction() {
    if (ignoreInput > 0) return;
    if (state === "title" || state === "result") resetPlay();
  }

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    clock += dt;
    titlePulse += dt;
    if (ignoreInput > 0) ignoreInput -= dt;

    if (!document.hidden) {
      if (state === "play") updatePlay(dt);
      else if (state === "result") {
        resultAge += dt;
        updateParticles(dt);
        updateCamera(dt * 0.4);
      }
    }
    render();
    requestAnimationFrame(tick);
  }

  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Space") {
      e.preventDefault();
    }
    if (e.repeat) return;
    onAction();
  });
  window.addEventListener("keyup", function (e) {
    keys[e.code] = false;
  });
  canvas.addEventListener("mousedown", function () { onAction(); });
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    onAction();
  }, { passive: false });

  document.addEventListener("visibilitychange", function () {
    lastTs = 0;
  });

  Promise.all([
    loadImage(IMG_PLAYER),
    loadImage(IMG_PRINCESS),
    loadImage(IMG_SLIME),
    loadImage(IMG_GATE),
    loadImage(IMG_TILE)
  ]).then(function (imgs) {
    imgPlayer = imgs[0];
    imgPrincess = imgs[1];
    imgSlime = imgs[2];
    imgGate = imgs[3];
    imgTile = imgs[4];
    tilePattern = ctx.createPattern(imgTile, "repeat");
    requestAnimationFrame(tick);
  }).catch(function () {
    ctx.fillStyle = "#200";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = "#fff";
    ctx.font = "20px sans-serif";
    ctx.fillText("画像の読み込みに失敗しました", 40, 80);
  });
})();

</script>
</body>
</html>
